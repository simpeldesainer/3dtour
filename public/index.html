<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>360 Tour</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #12151a;
    --panel: #1b1f26;
    --text: #e9e7e0;
    --text-dim: #8d94a1;
    --accent: #c08a4e;
    --radius: 3px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    overscroll-behavior: none;
  }
  #conn-banner{
    position: absolute; top: 0; left: 0; right: 0; z-index: 40;
    background: #4a3420; border-bottom: 1px solid #8a6539; color: #f0d9b8;
    font-size: 12px; line-height: 1.5; padding: 10px 16px; text-align: center;
  }

  #viewer-wrap{ position: relative; width: 100vw; height: 100vh; height: calc(var(--vh, 1vh) * 100); background: #000; }
  #canvas-host{ position: absolute; inset: 0; touch-action: none; }
  #canvas-host canvas{ display:block; cursor: grab; }
  #canvas-host.dragging canvas{ cursor: grabbing; }

  /* ---------- Empty state ---------- */
  #empty-state{
    position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; padding: 40px;
  }
  #empty-inner{ max-width: 320px; text-align: center; }
  #empty-inner h2{ font-size: 18px; font-weight: 600; margin: 0 0 8px 0; }
  #empty-inner p{ font-size: 13.5px; color: var(--text-dim); line-height: 1.55; margin: 0; }

  /* ---------- Top overlays ---------- */
  #floorplan-wrap{
    position: absolute; top: 16px; left: 16px; z-index: 5;
    max-width: 190px; pointer-events: none;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.6));
  }
  #floorplan-wrap img{ display:block; width: 100%; height: auto; }

  #project-chip{
    position: absolute; top: 16px; right: 16px; z-index: 5;
    background: rgba(18,21,26,0.55); backdrop-filter: blur(6px);
    padding: 8px 13px; border-radius: var(--radius);
    max-width: 46%; text-align: right; pointer-events: none;
  }
  #project-chip .pname{ font-size: 14px; font-weight: 600; margin: 0; }
  #project-chip .pdesc{ font-size: 11.5px; color: var(--text-dim); margin: 3px 0 0 0; line-height: 1.4; }

  /* ---------- Hint ---------- */
  #hint{
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--text-dim); background: rgba(18,21,26,0.55);
    padding: 6px 12px; border-radius: var(--radius); backdrop-filter: blur(6px);
    pointer-events: none; text-align: center; max-width: 60%; z-index: 5;
  }

  /* ---------------- Floating controls ---------------- */
  #gyro-btn, #music-btn{
    position: absolute; z-index: 6;
    right: 16px;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(18,21,26,0.65); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text); font-size: 19px;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
  }
  #gyro-btn{ bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
  #music-btn{ bottom: calc(172px + env(safe-area-inset-bottom, 0px)); }
  #gyro-btn.active, #music-btn.active{ background: var(--accent); color: #1a1408; border-color: var(--accent); }
  #gyro-btn.hidden, #music-btn.hidden{ display:none; }

  /* ---------- Bottom thumbnail strip ---------- */
  #thumb-strip{
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    display:flex; gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
  }
  #thumb-strip::-webkit-scrollbar{ height: 5px; }
  #thumb-strip::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.2); border-radius: 3px; }

  .thumb{
    position: relative; flex: 0 0 auto;
    width: 108px; height: 68px; border-radius: 4px; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: pointer;
    opacity: 0.75;
  }
  .thumb.active{ border-color: var(--accent); opacity: 1; }
  .thumb img{ width: 100%; height: 100%; object-fit: cover; display:block; }
  .thumb .thumb-label{
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: #fff; font-size: 10.5px; padding: 3px 6px 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #loading{
    position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); font-size: 13px; background: rgba(0,0,0,0.35); z-index: 20;
  }
  .hidden{ display:none !important; }

  #toast{
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #1a1408; font-size: 12.5px; padding: 8px 14px;
    border-radius: var(--radius); z-index: 30; opacity: 0; transition: opacity 0.25s ease;
    pointer-events: none; max-width: 70%; text-align: center;
  }
  #toast.show{ opacity: 1; }

  #fade{ position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 3; }
  #fade.on{ opacity: 1; }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px){
    #floorplan-wrap{ max-width: 110px; top: 12px; left: 12px; }
    #project-chip{ top: 12px; right: 12px; padding: 6px 10px; max-width: 52%; }
    #project-chip .pname{ font-size: 12.5px; }
    #project-chip .pdesc{ display: none; }
    #hint{ font-size: 11px; max-width: 80%; }
    .thumb{ width: 84px; height: 54px; }
    #thumb-strip{ padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
    #gyro-btn{ bottom: calc(96px + env(safe-area-inset-bottom, 0px)); right: 12px; width: 44px; height: 44px; }
    #music-btn{ bottom: calc(148px + env(safe-area-inset-bottom, 0px)); right: 12px; width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<div id="conn-banner" class="hidden"></div>

<div id="viewer-wrap">
  <div id="empty-state">
    <div id="empty-inner">
      <h2>Tour not ready yet</h2>
      <p>No photos have been added to this tour yet. Check back once the editor has uploaded some scenes.</p>
    </div>
  </div>

  <div id="canvas-host" class="hidden"></div>
  <div id="fade"></div>

  <div id="floorplan-wrap" class="hidden"><img id="floorplan-img" alt="Floor plan"></div>
  <div id="project-chip" class="hidden">
    <p class="pname" id="project-name"></p>
    <p class="pdesc" id="project-desc"></p>
  </div>
  <div id="hint" class="hidden"></div>
  <button id="gyro-btn" class="hidden" title="Look around by moving your phone">&#8635;</button>
  <button id="music-btn" class="hidden" title="Play background music">&#9834;</button>
  <audio id="bg-audio" loop preload="none"></audio>

  <div id="thumb-strip" class="hidden"></div>

  <div id="loading" class="hidden">Loading panorama…</div>
  <div id="toast"></div>
</div>

<script>
(function(){

  /* ---------------- Mobile viewport height fix ---------------- */
  // Mobile browsers report 100vh as the height *without* the address bar
  // collapsed, which pushes bottom-fixed UI (the thumbnail strip) off-screen.
  // This keeps a real, always-current viewport height in a CSS variable.
  function setViewportHeight(){
    const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
    document.documentElement.style.setProperty('--vh', h + 'px');
  }
  setViewportHeight();
  window.addEventListener('resize', setViewportHeight);
  window.addEventListener('orientationchange', setViewportHeight);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setViewportHeight);

  /* ---------------- API ---------------- */
  async function api(url){
    try{
      const res = await fetch(url);
      if (!res.ok) return { ok: false };
      const data = await res.json().catch(() => ({}));
      return { ok: true, data };
    } catch(e){
      return { ok: false };
    }
  }
  function showConnBanner(msg){
    const b = document.getElementById('conn-banner');
    b.textContent = msg;
    b.classList.remove('hidden');
  }

  /* ---------------- State ---------------- */
  let meta = { name: '360 Tour', description: '', hasFloorPlan: false, hasMusic: false, order: [] };
  let scenes = {};
  let currentId = null;

  /* ---------------- DOM refs ---------------- */
  const emptyStateEl = document.getElementById('empty-state');
  const canvasHost = document.getElementById('canvas-host');
  const hintEl = document.getElementById('hint');
  const loadingEl = document.getElementById('loading');
  const fadeEl = document.getElementById('fade');
  const toastEl = document.getElementById('toast');
  const projectChip = document.getElementById('project-chip');
  const projectNameEl = document.getElementById('project-name');
  const projectDescEl = document.getElementById('project-desc');
  const floorplanWrap = document.getElementById('floorplan-wrap');
  const floorplanImg = document.getElementById('floorplan-img');
  const thumbStrip = document.getElementById('thumb-strip');
  const gyroBtn = document.getElementById('gyro-btn');
  const musicBtn = document.getElementById('music-btn');
  const bgAudio = document.getElementById('bg-audio');

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  /* ---------------- Load tour ---------------- */
  async function loadAll(){
    const res = await api('/api/state');
    if (!res.ok){
      showConnBanner('Can\u2019t reach the tour server right now. Please try again shortly.');
      return;
    }
    meta = {
      name: res.data.name,
      description: res.data.description || '',
      hasFloorPlan: !!res.data.hasFloorPlan,
      hasMusic: !!res.data.hasMusic,
      order: res.data.order || []
    };
    scenes = res.data.scenes || {};
    document.title = meta.name;

    projectNameEl.textContent = meta.name;
    projectDescEl.textContent = meta.description;
    projectDescEl.classList.toggle('hidden', !meta.description);
    projectChip.classList.remove('hidden');

    if (meta.hasFloorPlan){
      floorplanImg.src = '/api/floorplan?v=' + Date.now();
      floorplanWrap.classList.remove('hidden');
    }

    if (meta.hasMusic){
      bgAudio.src = '/api/music';
      musicBtn.classList.remove('hidden');
    }

    renderThumbs();
    if (meta.order.length){
      currentId = meta.order[0];
      await enterScene(currentId, false);
    }

    if (window.DeviceOrientationEvent){
      gyroBtn.classList.remove('hidden');
    }
  }

  /* ---------------- Bottom thumbnail strip ---------------- */
  function renderThumbs(){
    thumbStrip.innerHTML = '';
    if (!meta.order.length){ thumbStrip.classList.add('hidden'); return; }
    thumbStrip.classList.remove('hidden');
    meta.order.forEach(id => {
      const s = scenes[id];
      if (!s) return;
      const el = document.createElement('div');
      el.className = 'thumb' + (id === currentId ? ' active' : '');
      const img = document.createElement('img');
      img.src = '/api/images/' + id;
      img.loading = 'lazy';
      const label = document.createElement('div');
      label.className = 'thumb-label';
      label.textContent = s.name;
      el.appendChild(img);
      el.appendChild(label);
      el.addEventListener('click', () => { if (id !== currentId) switchScene(id); });
      thumbStrip.appendChild(el);
    });
  }

  function showEmpty(){
    emptyStateEl.classList.remove('hidden');
    canvasHost.classList.add('hidden');
    hintEl.classList.add('hidden');
  }
  function showViewer(){
    emptyStateEl.classList.add('hidden');
    canvasHost.classList.remove('hidden');
    hintEl.classList.remove('hidden');
  }

  /* ---------------- Three.js viewer ---------------- */
  let renderer, camera, scene3d, sphereMesh, raycaster, mouse;
  let lon = 0, lat = 0, targetLon = 0, targetLat = 0;
  let isPointerDown = false, downX = 0, downY = 0, moved = false;
  let hotspotSprites = [];
  let currentTexture = null;

  function initThree(){
    if (renderer) return;
    const width = canvasHost.clientWidth, height = canvasHost.clientHeight;
    camera = new THREE.PerspectiveCamera(75, width / height, 1, 1200);
    scene3d = new THREE.Scene();

    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0x1b1f26 });
    sphereMesh = new THREE.Mesh(geometry, material);
    scene3d.add(sphereMesh);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(width, height);
    canvasHost.appendChild(renderer.domElement);

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    dom.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('resize', onResize);

    animate();
  }

  function onResize(){
    if (!renderer) return;
    const width = canvasHost.clientWidth, height = canvasHost.clientHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  }

  function onPointerDown(e){
    isPointerDown = true; moved = false;
    downX = e.clientX; downY = e.clientY;
    canvasHost.classList.add('dragging');
    renderer.domElement.style.cursor = '';
  }
  function onPointerMove(e){
    if (!isPointerDown){ updateHoverCursor(e); return; }
    if (gyroEnabled) return; // gyro owns the look direction while active
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    targetLon -= dx * 0.13;
    targetLat += dy * 0.13;
    targetLat = Math.max(-85, Math.min(85, targetLat));
    downX = e.clientX; downY = e.clientY;
  }
  function onPointerUp(e){
    if (isPointerDown && !moved) handleClick(e.clientX, e.clientY);
    isPointerDown = false;
    canvasHost.classList.remove('dragging');
  }
  function onWheel(e){
    e.preventDefault();
    camera.fov = Math.max(32, Math.min(95, camera.fov + e.deltaY * 0.04));
    camera.updateProjectionMatrix();
  }

  function hotspotHitsAt(clientX, clientY){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    return raycaster.intersectObjects(hotspotSprites.map(h => h.mesh));
  }
  function updateHoverCursor(e){
    if (!hotspotSprites.length){ renderer.domElement.style.cursor = 'grab'; return; }
    const hits = hotspotHitsAt(e.clientX, e.clientY);
    renderer.domElement.style.cursor = hits.length ? 'pointer' : 'grab';
  }
  function handleClick(clientX, clientY){
    const hits = hotspotHitsAt(clientX, clientY);
    if (hits.length){
      const hit = hotspotSprites.find(h => h.mesh === hits[0].object);
      if (hit) switchScene(hit.hotspot.target);
    }
  }

  function makeHotspotSprite(){
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 6, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(233,231,224,0.35)';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 16, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(233,231,224,0.9)';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 34, 0, Math.PI*2);
    ctx.fillStyle = '#c08a4e';
    ctx.fill();
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(46, 46, 1);
    return sprite;
  }

  function buildHotspots(){
    hotspotSprites.forEach(h => scene3d.remove(h.mesh));
    hotspotSprites = [];
    const s = scenes[currentId];
    if (!s) return;
    (s.hotspots || []).forEach(hotspot => {
      const sprite = makeHotspotSprite();
      const dir = new THREE.Vector3(hotspot.x, hotspot.y, hotspot.z).normalize();
      sprite.position.copy(dir.multiplyScalar(480));
      scene3d.add(sprite);
      hotspotSprites.push({ mesh: sprite, hotspot });
    });
  }

  function animate(){
    requestAnimationFrame(animate);
    lon += (targetLon - lon) * 0.12;
    lat += (targetLat - lat) * 0.12;
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    const x = 500 * Math.sin(phi) * Math.cos(theta);
    const y = 500 * Math.cos(phi);
    const z = 500 * Math.sin(phi) * Math.sin(theta);
    camera.lookAt(x, y, z);

    const pulse = 46 + Math.sin(Date.now() / 400) * 4;
    hotspotSprites.forEach(h => h.mesh.scale.set(pulse, pulse, 1));

    if (renderer) renderer.render(scene3d, camera);
  }

  function loadTextureForCurrent(){
    return new Promise((resolve) => {
      const loader = new THREE.TextureLoader();
      loader.load(
        '/api/images/' + currentId,
        (texture) => {
          if (currentTexture) currentTexture.dispose();
          currentTexture = texture;
          sphereMesh.material.map = texture;
          sphereMesh.material.color.set(0xffffff);
          sphereMesh.material.needsUpdate = true;
          resolve();
        },
        undefined,
        () => { toast('Could not load this photo.'); resolve(); }
      );
    });
  }

  /* ---------------- Scene transitions ---------------- */
  async function enterScene(id, doFade){
    currentId = id;
    showViewer();
    initThree();
    if (doFade) fadeEl.classList.add('on');
    loadingEl.classList.remove('hidden');
    await loadTextureForCurrent();
    buildHotspots();
    lon = targetLon; lat = targetLat = 0; targetLon = lon;
    updateHint();
    loadingEl.classList.add('hidden');
    if (doFade) setTimeout(() => fadeEl.classList.remove('on'), 30);
    renderThumbs();
  }

  async function switchScene(id){
    if (!scenes[id]) return;
    fadeEl.classList.add('on');
    await new Promise(r => setTimeout(r, 180));
    await enterScene(id, true);
  }

  function updateHint(){
    if (gyroEnabled){
      hintEl.textContent = 'Move your phone to look around · tap a marker to move to that room';
      return;
    }
    const s = scenes[currentId];
    const hasHotspots = s && s.hotspots && s.hotspots.length;
    hintEl.textContent = hasHotspots
      ? 'Drag to look around · tap a marker to move to that room'
      : 'Drag to look around · scroll to zoom';
  }

  /* ---------------- Gyroscope look control ---------------- */
  let gyroEnabled = false;
  let gyroBaseAlpha = null, gyroBaseBeta = null, gyroStartLon = 0, gyroStartLat = 0;

  function onDeviceOrientation(e){
    if (e.alpha === null || e.alpha === undefined) return;
    if (gyroBaseAlpha === null){
      gyroBaseAlpha = e.alpha;
      gyroBaseBeta = e.beta || 0;
      gyroStartLon = targetLon;
      gyroStartLat = targetLat;
    }
    let deltaAlpha = e.alpha - gyroBaseAlpha;
    if (deltaAlpha > 180) deltaAlpha -= 360;
    if (deltaAlpha < -180) deltaAlpha += 360;
    const deltaBeta = (e.beta || 0) - gyroBaseBeta;
    targetLon = gyroStartLon - deltaAlpha;
    targetLat = Math.max(-85, Math.min(85, gyroStartLat + deltaBeta));
  }

  async function enableGyro(){
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      try{
        const state = await DeviceOrientationEvent.requestPermission();
        if (state !== 'granted'){ toast('Motion access was not granted.'); return; }
      } catch(e){ toast('Could not request motion access.'); return; }
    }
    gyroBaseAlpha = null;
    gyroEnabled = true;
    gyroBtn.classList.add('active');
    window.addEventListener('deviceorientation', onDeviceOrientation);
    updateHint();
  }
  function disableGyro(){
    gyroEnabled = false;
    gyroBtn.classList.remove('active');
    window.removeEventListener('deviceorientation', onDeviceOrientation);
    updateHint();
  }
  gyroBtn.addEventListener('click', () => { gyroEnabled ? disableGyro() : enableGyro(); });

  /* ---------------- Background music ---------------- */
  musicBtn.addEventListener('click', () => {
    if (bgAudio.paused){
      bgAudio.play().then(() => {
        musicBtn.classList.add('active');
        musicBtn.innerHTML = '&#9834;';
      }).catch(() => toast('Could not play the music.'));
    } else {
      bgAudio.pause();
      musicBtn.classList.remove('active');
    }
  });

  /* ---------------- Boot ---------------- */
  loadAll();

})();
</script>
</body>
</html>
