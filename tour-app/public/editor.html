<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360 Tour Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #12151a;
    --panel: #1b1f26;
    --panel-hi: #232833;
    --line: #2a303b;
    --text: #e9e7e0;
    --text-dim: #8d94a1;
    --accent: #c08a4e;
    --accent-dim: #8a6539;
    --danger: #b5654f;
    --radius: 3px;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  #app{ display:flex; height:100vh; width:100vw; }

  #sidebar{
    width: 252px; min-width: 252px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display:flex; flex-direction: column;
    z-index: 5;
  }
  #conn-banner{
    background: #4a3420;
    border-bottom: 1px solid var(--accent-dim);
    color: #f0d9b8;
    font-size: 12px;
    line-height: 1.5;
    padding: 10px 16px;
  }
  #sidebar-head{ padding: 16px 16px 14px 16px; border-bottom: 1px solid var(--line); }
  .field-label{ font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin: 0 0 8px 0; }
  .project-name-input{
    width: 100%; background: transparent; border: none; outline: none;
    font-family: inherit; font-size: 15px; font-weight: 600; color: var(--text);
    padding: 2px 0; margin-bottom: 4px; border-bottom: 1px solid transparent;
  }
  .project-name-input:hover, .project-name-input:focus{ border-bottom-color: var(--line); }
  .project-desc-input{
    width: 100%; background: transparent; border: none; outline: none; resize: none;
    font-family: inherit; font-size: 12px; color: var(--text-dim); line-height: 1.5;
    padding: 2px 0; border-bottom: 1px solid transparent;
  }
  .project-desc-input:hover, .project-desc-input:focus{ border-bottom-color: var(--line); }
  #scene-list{ flex: 1; overflow-y: auto; padding: 8px 8px; }
  .scene-row{
    display:flex; align-items:center; gap: 8px;
    padding: 9px 10px; border-radius: var(--radius);
    cursor: pointer; margin-bottom: 2px;
    border: 1px solid transparent; position: relative;
  }
  .scene-row:hover{ background: var(--panel-hi); }
  .scene-row.active{ background: var(--panel-hi); border-color: var(--accent-dim); }
  .scene-dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .scene-row.active .scene-dot{ background: var(--accent); }
  .scene-name{
    flex: 1; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: transparent; border: none; color: var(--text); font-family: inherit; outline: none; padding: 0;
  }
  .scene-remove{
    opacity: 0; background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px;
  }
  .scene-row:hover .scene-remove{ opacity: 1; }
  .scene-remove:hover{ color: var(--danger); }

  #sidebar-foot{ padding: 12px; border-top: 1px solid var(--line); display:flex; flex-direction: column; gap: 8px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap: 7px;
    padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--panel-hi); color: var(--text); font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover{ border-color: var(--accent-dim); }
  .btn-primary{ background: var(--accent); border-color: var(--accent); color: #1a1408; }
  .btn-primary:hover{ background: #cd9a5e; }
  .btn:disabled{ opacity: 0.5; cursor: default; }
  .btn-text{
    background: none; border: none; color: var(--text-dim); font-size: 12px;
    cursor: pointer; text-align: left; padding: 4px 2px; font-family: inherit;
  }
  .btn-text:hover{ color: var(--text); }

  #empty-state{ flex:1; display:flex; align-items:center; justify-content:center; padding: 40px; }
  #empty-inner{ max-width: 340px; text-align: left; }
  #empty-inner h2{ font-size: 19px; font-weight: 600; margin: 0 0 8px 0; }
  #empty-inner p{ font-size: 13.5px; color: var(--text-dim); line-height: 1.55; margin: 0 0 20px 0; }

  #viewer-wrap{ flex: 1; position: relative; background: #000; }
  #canvas-host{ position: absolute; inset: 0; }
  #canvas-host canvas{ display:block; cursor: grab; }
  #canvas-host.dragging canvas{ cursor: grabbing; }

  #topbar{
    position: absolute; top: 0; left: 0; right: 0;
    display:flex; align-items:center; justify-content: space-between;
    padding: 16px 20px; z-index: 4; pointer-events: none;
  }
  #topbar > *{ pointer-events: auto; }
  #scene-label{
    font-size: 14px; font-weight: 600; background: rgba(18,21,26,0.55);
    padding: 7px 12px; border-radius: var(--radius); backdrop-filter: blur(6px);
  }
  #mode-toggle{ display:flex; background: rgba(18,21,26,0.55); border-radius: var(--radius); backdrop-filter: blur(6px); padding: 3px; gap: 2px; }
  .mode-btn{ padding: 6px 13px; font-size: 12.5px; font-weight: 500; border: none; background: none; color: var(--text-dim); cursor: pointer; border-radius: 2px; font-family: inherit; }
  .mode-btn.active{ background: var(--accent); color: #1a1408; }

  #hint{
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--text-dim); background: rgba(18,21,26,0.55);
    padding: 6px 12px; border-radius: var(--radius); backdrop-filter: blur(6px);
    pointer-events: none; text-align: center; max-width: 80%;
  }

  #loading{
    position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); font-size: 13px; background: rgba(0,0,0,0.35); z-index: 6;
  }
  .hidden{ display:none !important; }

  #modal-backdrop{ position: fixed; inset: 0; background: rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index: 20; }
  #modal{ width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  #modal h3{ margin: 0 0 4px 0; font-size: 15px; font-weight: 600; }
  #modal p{ margin: 0 0 14px 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  #modal select, #modal input[type=text], #modal input[type=password]{
    width: 100%; padding: 9px 10px; background: var(--panel-hi); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text); font-size: 13px; font-family: inherit; margin-bottom: 14px;
  }
  #modal-actions{ display:flex; justify-content: flex-end; gap: 8px; }
  #modal-actions .btn{ padding: 8px 14px; }

  #toast{
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--danger); color: #fff; font-size: 12.5px; padding: 8px 14px;
    border-radius: var(--radius); z-index: 30; opacity: 0; transition: opacity 0.25s ease;
    pointer-events: none; max-width: 70%; text-align: center;
  }
  #toast.show{ opacity: 1; }

  #fade{ position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 3; }
  #fade.on{ opacity: 1; }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: var(--panel-hi); border-radius: 4px; }
  ::-webkit-scrollbar-track{ background: transparent; }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="conn-banner" class="hidden"></div>
    <div id="sidebar-head">
      <p class="field-label">Editor</p>
      <input id="project-name" class="project-name-input" placeholder="Project name" spellcheck="false">
      <textarea id="project-desc" class="project-desc-input" placeholder="Add a short description (address, client, notes)…" rows="2"></textarea>
    </div>
    <div id="scene-list"></div>
    <div id="sidebar-foot">
      <button class="btn btn-primary" id="add-scene-btn">+ Add 360 photo</button>
      <a class="btn-text" id="view-public-link" href="/" target="_blank" rel="noopener">View public tour \u2197</a>
      <button class="btn-text hidden" id="reset-btn">Clear entire tour</button>
    </div>
  </div>

  <div id="viewer-wrap">
    <div id="empty-state">
      <div id="empty-inner">
        <h2>Start your tour</h2>
        <p>Add an equirectangular (360°) photo to begin. Once you have two or more scenes, switch to Connect mode to link them with clickable points, so viewers can walk from room to room.</p>
        <button class="btn btn-primary" id="add-scene-btn-2">+ Add 360 photo</button>
      </div>
    </div>

    <div id="canvas-host" class="hidden"></div>
    <div id="fade"></div>

    <div id="topbar" class="hidden">
      <span id="scene-label"></span>
      <div id="mode-toggle">
        <button class="mode-btn active" data-mode="explore">Explore</button>
        <button class="mode-btn" data-mode="connect">Connect</button>
      </div>
    </div>

    <div id="hint" class="hidden"></div>
    <div id="loading" class="hidden">Loading panorama…</div>
    <div id="toast"></div>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" class="hidden">

<div id="modal-backdrop" class="hidden">
  <div id="modal"></div>
</div>

<script>
(function(){

  /* ---------------- API helpers ---------------- */
  function getEditKey(){ return localStorage.getItem('tour-edit-key') || ''; }
  function setEditKey(k){ localStorage.setItem('tour-edit-key', k); }

  async function apiRaw(method, url, body, key){
    try{
      const headers = {};
      if (body) headers['Content-Type'] = 'application/json';
      if (key) headers['x-edit-key'] = key;
      const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
      if (res.status === 401) return { ok: false, error: 'unauthorized' };
      if (!res.ok){
        let msg = 'request-failed';
        try{ const j = await res.json(); msg = j.error || msg; }catch(e){}
        return { ok: false, error: msg };
      }
      const data = await res.json().catch(() => ({}));
      return { ok: true, data };
    } catch(e){
      return { ok: false, error: 'network' };
    }
  }

  // Plain read — used for GET requests, no key needed.
  async function api(method, url, body){
    return apiRaw(method, url, body, null);
  }

  // Protected write — attaches the saved edit key, and prompts for one if the
  // server rejects the request (wrong key, or none saved yet).
  async function apiEditor(method, url, body){
    let res = await apiRaw(method, url, body, getEditKey());
    if (!res.ok && res.error === 'unauthorized'){
      const key = await promptForKey();
      if (key === null) return res;
      setEditKey(key);
      res = await apiRaw(method, url, body, key);
      if (!res.ok && res.error === 'unauthorized') toast('That edit key wasn\u2019t accepted.');
    }
    return res;
  }

  function promptForKey(){
    return new Promise(resolve => {
      openModal({
        title: 'Enter edit key',
        body: 'This tour is protected. Enter the edit key to make changes.',
        fields: [{ type: 'password', key: 'key' }],
        confirmLabel: 'Continue',
        onConfirm: ({ key }) => resolve(key || ''),
        onCancel: () => resolve(null)
      });
    });
  }

  function showConnBanner(msg){
    const b = document.getElementById('conn-banner');
    b.textContent = msg;
    b.classList.remove('hidden');
  }
  function hideConnBanner(){
    document.getElementById('conn-banner').classList.add('hidden');
  }

  /* ---------------- State ---------------- */
  let meta = { name: '360 Tour', description: '', order: [] };
  let scenes = {};        // id -> { id, name, hotspots: [{id,x,y,z,target,label}] }
  let currentId = null;
  let mode = 'explore';

  /* ---------------- DOM refs ---------------- */
  const sceneListEl = document.getElementById('scene-list');
  const emptyStateEl = document.getElementById('empty-state');
  const canvasHost = document.getElementById('canvas-host');
  const topbar = document.getElementById('topbar');
  const sceneLabel = document.getElementById('scene-label');
  const hintEl = document.getElementById('hint');
  const loadingEl = document.getElementById('loading');
  const fadeEl = document.getElementById('fade');
  const toastEl = document.getElementById('toast');
  const fileInput = document.getElementById('file-input');
  const resetBtn = document.getElementById('reset-btn');
  const projectNameInput = document.getElementById('project-name');
  const projectDescInput = document.getElementById('project-desc');

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 2800);
  }

  /* ---------------- Load tour from server ---------------- */
  async function loadAll(){
    const res = await api('GET', '/api/state');
    if (!res.ok){
      showConnBanner('Can\u2019t reach the server \u2014 make sure this is running behind the backend (npm start, or your Netlify deploy), not opened as a plain file.');
      renderSidebar();
      return;
    }
    hideConnBanner();
    meta = { name: res.data.name, description: res.data.description || '', order: res.data.order || [] };
    scenes = res.data.scenes || {};
    projectNameInput.value = meta.name;
    projectDescInput.value = meta.description;
    document.title = meta.name + ' — Editor';
    if (meta.order.length){
      currentId = meta.order[0];
      renderSidebar();
      await enterScene(currentId, false);
    } else {
      renderSidebar();
    }
  }

  async function saveProjectField(field, value){
    const res = await apiEditor('PATCH', '/api/tour', { [field]: value });
    if (!res.ok){
      toast('Could not save the project ' + field + '.');
      return;
    }
    meta[field] = res.data[field];
    if (field === 'name') document.title = meta.name + ' — Editor';
  }
  projectNameInput.addEventListener('change', () => {
    const v = projectNameInput.value.trim() || meta.name;
    projectNameInput.value = v;
    saveProjectField('name', v);
  });
  projectDescInput.addEventListener('change', () => {
    saveProjectField('description', projectDescInput.value.trim());
  });

  /* ---------------- Sidebar rendering ---------------- */
  function renderSidebar(){
    sceneListEl.innerHTML = '';
    meta.order.forEach(id => {
      const s = scenes[id];
      if (!s) return;
      const row = document.createElement('div');
      row.className = 'scene-row' + (id === currentId ? ' active' : '');
      row.dataset.id = id;

      const dot = document.createElement('div');
      dot.className = 'scene-dot';

      const nameInput = document.createElement('input');
      nameInput.className = 'scene-name';
      nameInput.value = s.name;
      nameInput.spellcheck = false;
      nameInput.addEventListener('click', e => e.stopPropagation());
      nameInput.addEventListener('change', async () => {
        const newName = nameInput.value.trim() || s.name;
        nameInput.value = newName;
        const res = await apiEditor('PATCH', '/api/scenes/' + id, { name: newName });
        if (res.ok){
          s.name = newName;
          if (id === currentId) sceneLabel.textContent = s.name;
          Object.values(scenes).forEach(sc => (sc.hotspots || []).forEach(h => { if (h.target === id) h.label = newName; }));
        } else {
          toast('Could not rename this scene.');
          nameInput.value = s.name;
        }
      });

      const remove = document.createElement('button');
      remove.className = 'scene-remove';
      remove.textContent = '\u00d7';
      remove.title = 'Remove scene';
      remove.addEventListener('click', async (e) => {
        e.stopPropagation();
        removeScene(id);
      });

      row.appendChild(dot);
      row.appendChild(nameInput);
      row.appendChild(remove);
      row.addEventListener('click', () => { if (id !== currentId) switchScene(id); });
      sceneListEl.appendChild(row);
    });
    resetBtn.classList.toggle('hidden', meta.order.length === 0);
  }

  async function removeScene(id){
    const proceed = await confirmToast('Remove this scene? This can\'t be undone.');
    if (!proceed) return;

    const res = await apiEditor('DELETE', '/api/scenes/' + id);
    if (!res.ok){ toast('Could not remove this scene.'); return; }

    meta.order = meta.order.filter(x => x !== id);
    delete scenes[id];
    Object.values(scenes).forEach(s => { s.hotspots = (s.hotspots || []).filter(h => h.target !== id); });

    if (currentId === id) currentId = meta.order[0] || null;
    renderSidebar();
    if (currentId) await enterScene(currentId, false);
    else showEmpty();
  }

  function showEmpty(){
    emptyStateEl.classList.remove('hidden');
    canvasHost.classList.add('hidden');
    topbar.classList.add('hidden');
    hintEl.classList.add('hidden');
  }
  function showViewer(){
    emptyStateEl.classList.add('hidden');
    canvasHost.classList.remove('hidden');
    topbar.classList.remove('hidden');
    hintEl.classList.remove('hidden');
  }

  /* ---------------- Confirm helper ---------------- */
  function confirmToast(message){
    return new Promise(resolve => {
      openModal({
        title: 'Please confirm', body: message, fields: [],
        confirmLabel: 'Remove', danger: true,
        onConfirm: () => resolve(true), onCancel: () => resolve(false)
      });
    });
  }

  /* ---------------- Modal ---------------- */
  const backdrop = document.getElementById('modal-backdrop');
  const modalEl = document.getElementById('modal');

  function openModal({ title, body, fields, confirmLabel, danger, onConfirm, onCancel }){
    modalEl.innerHTML = '';
    const h = document.createElement('h3'); h.textContent = title;
    const p = document.createElement('p'); p.textContent = body;
    modalEl.appendChild(h);
    modalEl.appendChild(p);

    const values = {};
    (fields || []).forEach(f => {
      if (f.type === 'select'){
        const sel = document.createElement('select');
        f.options.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.value; opt.textContent = o.label;
          sel.appendChild(opt);
        });
        modalEl.appendChild(sel);
        values[f.key] = () => sel.value;
      } else if (f.type === 'password' || f.type === 'text'){
        const input = document.createElement('input');
        input.type = f.type;
        input.placeholder = f.placeholder || '';
        input.autofocus = true;
        modalEl.appendChild(input);
        values[f.key] = () => input.value;
      }
    });

    const actions = document.createElement('div');
    actions.id = 'modal-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn';
    cancelBtn.textContent = 'Cancel';
    const okBtn = document.createElement('button');
    okBtn.className = 'btn btn-primary';
    okBtn.textContent = confirmLabel || 'Confirm';
    if (danger){ okBtn.style.background = 'var(--danger)'; okBtn.style.borderColor = 'var(--danger)'; okBtn.style.color = '#fff'; }

    function close(){ backdrop.classList.add('hidden'); }
    cancelBtn.addEventListener('click', () => { close(); onCancel && onCancel(); });
    okBtn.addEventListener('click', () => {
      const result = {};
      Object.keys(values).forEach(k => result[k] = values[k]());
      close();
      onConfirm && onConfirm(result);
    });

    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    modalEl.appendChild(actions);
    backdrop.classList.remove('hidden');
  }

  /* ---------------- Image ingestion ---------------- */
  function fileToCompressedDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read-failed'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('decode-failed'));
        img.onload = () => {
          let w = img.width, h = img.height;
          let maxW = 3200;
          if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const targetBytes = 2.5 * 1024 * 1024; // keeps the request comfortably under hosting limits
          const sizeOf = (du) => Math.round((du.length - du.indexOf(',') - 1) * 0.75);

          let quality = 0.85;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (sizeOf(dataUrl) > targetBytes && quality > 0.35){
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          // If quality alone isn't enough, also shrink dimensions.
          while (sizeOf(dataUrl) > targetBytes && w > 1200){
            w = Math.round(w * 0.85); h = Math.round(h * 0.85);
            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          }
          resolve(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handleFile(file){
    if (!file || !file.type.startsWith('image/')){
      toast('Please choose an image file.');
      return;
    }
    loadingEl.textContent = 'Processing photo…';
    loadingEl.classList.remove('hidden');
    try{
      const dataUrl = await fileToCompressedDataURL(file);
      const name = 'Scene ' + (meta.order.length + 1);
      const res = await apiEditor('POST', '/api/scenes', { name, dataUrl });
      if (!res.ok){
        toast('Could not upload this photo — check the server is reachable.');
        loadingEl.classList.add('hidden');
        return;
      }
      const scene = res.data;
      scenes[scene.id] = scene;
      meta.order.push(scene.id);
      currentId = scene.id;
      renderSidebar();
      await enterScene(scene.id, false);
    } catch(err){
      toast('Could not process that photo.');
    } finally {
      loadingEl.classList.add('hidden');
    }
  }

  document.getElementById('add-scene-btn').addEventListener('click', () => fileInput.click());
  document.getElementById('add-scene-btn-2').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    fileInput.value = '';
    if (f) handleFile(f);
  });

  resetBtn.addEventListener('click', () => {
    openModal({
      title: 'Clear entire tour?',
      body: 'This removes every scene and connection from the server. This can\'t be undone.',
      fields: [], confirmLabel: 'Clear tour', danger: true,
      onConfirm: async () => {
        const res = await apiEditor('DELETE', '/api/tour');
        if (!res.ok){ toast('Could not clear the tour.'); return; }
        meta = { name: '360 Tour', order: [] };
        scenes = {};
        currentId = null;
        renderSidebar();
        showEmpty();
      },
      onCancel: () => {}
    });
  });

  /* ---------------- Three.js viewer ---------------- */
  let renderer, camera, scene3d, sphereMesh, raycaster, mouse;
  let lon = 0, lat = 0, targetLon = 0, targetLat = 0;
  let isPointerDown = false, downX = 0, downY = 0, moved = false;
  let hotspotSprites = [];
  let currentTexture = null;

  function initThree(){
    if (renderer) return;
    const width = canvasHost.clientWidth, height = canvasHost.clientHeight;
    camera = new THREE.PerspectiveCamera(75, width / height, 1, 1200);
    scene3d = new THREE.Scene();

    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0x1b1f26 });
    sphereMesh = new THREE.Mesh(geometry, material);
    scene3d.add(sphereMesh);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(width, height);
    canvasHost.appendChild(renderer.domElement);

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    dom.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('resize', onResize);

    animate();
  }

  function onResize(){
    if (!renderer) return;
    const width = canvasHost.clientWidth, height = canvasHost.clientHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  }

  function onPointerDown(e){
    isPointerDown = true; moved = false;
    downX = e.clientX; downY = e.clientY;
    canvasHost.classList.add('dragging');
  }
  function onPointerMove(e){
    if (!isPointerDown) return;
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    targetLon -= dx * 0.13;
    targetLat += dy * 0.13;
    targetLat = Math.max(-85, Math.min(85, targetLat));
    downX = e.clientX; downY = e.clientY;
  }
  function onPointerUp(e){
    if (isPointerDown && !moved) handleClick(e.clientX, e.clientY);
    isPointerDown = false;
    canvasHost.classList.remove('dragging');
  }
  function onWheel(e){
    e.preventDefault();
    camera.fov = Math.max(32, Math.min(95, camera.fov + e.deltaY * 0.04));
    camera.updateProjectionMatrix();
  }

  function handleClick(clientX, clientY){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    if (mode === 'explore'){
      const hits = raycaster.intersectObjects(hotspotSprites.map(h => h.mesh));
      if (hits.length){
        const hit = hotspotSprites.find(h => h.mesh === hits[0].object);
        if (hit) switchScene(hit.hotspot.target);
      }
    } else if (mode === 'connect'){
      const spriteHits = raycaster.intersectObjects(hotspotSprites.map(h => h.mesh));
      if (spriteHits.length){
        const hit = hotspotSprites.find(h => h.mesh === spriteHits[0].object);
        if (hit) promptRemoveHotspot(hit.hotspot);
        return;
      }
      const sphereHits = raycaster.intersectObject(sphereMesh);
      if (sphereHits.length){
        promptAddHotspot(sphereHits[0].point.clone().normalize());
      }
    }
  }

  function promptAddHotspot(direction){
    const options = meta.order
      .filter(id => id !== currentId)
      .map(id => ({ value: id, label: scenes[id].name }));
    if (!options.length){
      toast('Add another scene first to connect to it.');
      return;
    }
    openModal({
      title: 'Connect to another scene',
      body: 'Choose which scene this point should lead to.',
      fields: [{ type: 'select', key: 'target', options }],
      confirmLabel: 'Add connection',
      onConfirm: async ({ target }) => {
        const res = await apiEditor('POST', '/api/scenes/' + currentId + '/hotspots', {
          x: direction.x, y: direction.y, z: direction.z, target
        });
        if (!res.ok){ toast('Could not add that connection.'); return; }
        scenes[currentId].hotspots.push(res.data);
        buildHotspots();
      },
      onCancel: () => {}
    });
  }

  function promptRemoveHotspot(hotspot){
    openModal({
      title: 'Remove connection?',
      body: 'This point currently leads to "' + hotspot.label + '".',
      fields: [], confirmLabel: 'Remove', danger: true,
      onConfirm: async () => {
        const res = await apiEditor('DELETE', '/api/scenes/' + currentId + '/hotspots/' + hotspot.id);
        if (!res.ok){ toast('Could not remove that connection.'); return; }
        scenes[currentId].hotspots = scenes[currentId].hotspots.filter(h => h.id !== hotspot.id);
        buildHotspots();
      },
      onCancel: () => {}
    });
  }

  function makeHotspotSprite(){
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 10, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(233,231,224,0.85)';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 30, 0, Math.PI*2);
    ctx.fillStyle = '#c08a4e';
    ctx.fill();
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(34, 34, 1);
    return sprite;
  }

  function buildHotspots(){
    hotspotSprites.forEach(h => scene3d.remove(h.mesh));
    hotspotSprites = [];
    const s = scenes[currentId];
    if (!s) return;
    (s.hotspots || []).forEach(hotspot => {
      const sprite = makeHotspotSprite();
      const dir = new THREE.Vector3(hotspot.x, hotspot.y, hotspot.z).normalize();
      sprite.position.copy(dir.multiplyScalar(480));
      scene3d.add(sprite);
      hotspotSprites.push({ mesh: sprite, hotspot });
    });
  }

  function animate(){
    requestAnimationFrame(animate);
    lon += (targetLon - lon) * 0.12;
    lat += (targetLat - lat) * 0.12;
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    const x = 500 * Math.sin(phi) * Math.cos(theta);
    const y = 500 * Math.cos(phi);
    const z = 500 * Math.sin(phi) * Math.sin(theta);
    camera.lookAt(x, y, z);
    if (renderer) renderer.render(scene3d, camera);
  }

  function loadTextureForCurrent(){
    return new Promise((resolve) => {
      const loader = new THREE.TextureLoader();
      loader.load(
        '/api/images/' + currentId + '?v=' + Date.now(),
        (texture) => {
          if (currentTexture) currentTexture.dispose();
          currentTexture = texture;
          sphereMesh.material.map = texture;
          sphereMesh.material.color.set(0xffffff);
          sphereMesh.material.needsUpdate = true;
          resolve();
        },
        undefined,
        () => { toast('Could not load this photo.'); resolve(); }
      );
    });
  }

  /* ---------------- Scene transitions ---------------- */
  async function enterScene(id, doFade){
    currentId = id;
    showViewer();
    initThree();
    if (doFade) fadeEl.classList.add('on');
    loadingEl.classList.remove('hidden');
    await loadTextureForCurrent();
    buildHotspots();
    lon = targetLon; lat = targetLat = 0; targetLon = lon;
    sceneLabel.textContent = scenes[id].name;
    updateHint();
    loadingEl.classList.add('hidden');
    if (doFade) setTimeout(() => fadeEl.classList.remove('on'), 30);
    renderSidebar();
  }

  async function switchScene(id){
    if (!scenes[id]) return;
    fadeEl.classList.add('on');
    await new Promise(r => setTimeout(r, 180));
    await enterScene(id, true);
  }

  function updateHint(){
    if (mode === 'explore'){
      const s = scenes[currentId];
      const hasHotspots = s && s.hotspots && s.hotspots.length;
      hintEl.textContent = hasHotspots
        ? 'Drag to look around · click a marker to move to that scene'
        : 'Drag to look around · scroll to zoom';
    } else {
      hintEl.textContent = 'Click anywhere on the photo to place a connection';
    }
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
      updateHint();
    });
  });

  /* ---------------- Boot ---------------- */
  loadAll();

})();
</script>
</body>
</html>
