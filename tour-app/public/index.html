<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360 Tour</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #12151a;
    --panel: #1b1f26;
    --panel-hi: #232833;
    --line: #2a303b;
    --text: #e9e7e0;
    --text-dim: #8d94a1;
    --accent: #c08a4e;
    --radius: 3px;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  #app{ display:flex; height:100vh; width:100vw; }

  #sidebar{
    width: 232px; min-width: 232px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display:flex; flex-direction: column;
    z-index: 5;
  }
  #conn-banner{
    background: #4a3420; border-bottom: 1px solid #8a6539; color: #f0d9b8;
    font-size: 12px; line-height: 1.5; padding: 10px 16px;
  }
  #sidebar-head{ padding: 18px 16px 14px 16px; border-bottom: 1px solid var(--line); }
  #project-name{ font-size: 15px; font-weight: 600; letter-spacing: 0.2px; margin: 0 0 6px 0; }
  #project-desc{ font-size: 12px; color: var(--text-dim); margin: 0; line-height: 1.5; }
  #scene-list{ flex: 1; overflow-y: auto; padding: 8px 8px; }
  .scene-row{
    display:flex; align-items:center; gap: 8px;
    padding: 9px 10px; border-radius: var(--radius);
    cursor: pointer; margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .scene-row:hover{ background: var(--panel-hi); }
  .scene-row.active{ background: var(--panel-hi); border-color: #8a6539; }
  .scene-dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .scene-row.active .scene-dot{ background: var(--accent); }
  .scene-name{ flex: 1; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #empty-state{ flex:1; display:flex; align-items:center; justify-content:center; padding: 40px; }
  #empty-inner{ max-width: 320px; text-align: left; }
  #empty-inner h2{ font-size: 18px; font-weight: 600; margin: 0 0 8px 0; }
  #empty-inner p{ font-size: 13.5px; color: var(--text-dim); line-height: 1.55; margin: 0; }

  #viewer-wrap{ flex: 1; position: relative; background: #000; }
  #canvas-host{ position: absolute; inset: 0; }
  #canvas-host canvas{ display:block; cursor: grab; }
  #canvas-host.dragging canvas{ cursor: grabbing; }

  #topbar{
    position: absolute; top: 0; left: 0; right: 0;
    display:flex; align-items:center; padding: 16px 20px; z-index: 4; pointer-events: none;
  }
  #scene-label{
    font-size: 14px; font-weight: 600; background: rgba(18,21,26,0.55);
    padding: 7px 12px; border-radius: var(--radius); backdrop-filter: blur(6px);
  }

  #hint{
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--text-dim); background: rgba(18,21,26,0.55);
    padding: 6px 12px; border-radius: var(--radius); backdrop-filter: blur(6px);
    pointer-events: none; text-align: center; max-width: 80%;
  }

  #loading{
    position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); font-size: 13px; background: rgba(0,0,0,0.35); z-index: 6;
  }
  .hidden{ display:none !important; }

  #toast{
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #1a1408; font-size: 12.5px; padding: 8px 14px;
    border-radius: var(--radius); z-index: 30; opacity: 0; transition: opacity 0.25s ease;
    pointer-events: none; max-width: 70%; text-align: center;
  }
  #toast.show{ opacity: 1; }

  #fade{ position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 3; }
  #fade.on{ opacity: 1; }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: var(--panel-hi); border-radius: 4px; }
  ::-webkit-scrollbar-track{ background: transparent; }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="conn-banner" class="hidden"></div>
    <div id="sidebar-head">
      <p id="project-name">360 Tour</p>
      <p id="project-desc"></p>
    </div>
    <div id="scene-list"></div>
  </div>

  <div id="viewer-wrap">
    <div id="empty-state">
      <div id="empty-inner">
        <h2>Tour not ready yet</h2>
        <p>No photos have been added to this tour yet. Check back once the editor has uploaded some scenes.</p>
      </div>
    </div>

    <div id="canvas-host" class="hidden"></div>
    <div id="fade"></div>

    <div id="topbar" class="hidden">
      <span id="scene-label"></span>
    </div>

    <div id="hint" class="hidden"></div>
    <div id="loading" class="hidden">Loading panorama…</div>
    <div id="toast"></div>
  </div>
</div>

<script>
(function(){

  /* ---------------- API ---------------- */
  async function api(url){
    try{
      const res = await fetch(url);
      if (!res.ok) return { ok: false };
      const data = await res.json().catch(() => ({}));
      return { ok: true, data };
    } catch(e){
      return { ok: false };
    }
  }

  function showConnBanner(msg){
    const b = document.getElementById('conn-banner');
    b.textContent = msg;
    b.classList.remove('hidden');
  }

  /* ---------------- State ---------------- */
  let meta = { name: '360 Tour', description: '', order: [] };
  let scenes = {};
  let currentId = null;

  /* ---------------- DOM refs ---------------- */
  const sceneListEl = document.getElementById('scene-list');
  const emptyStateEl = document.getElementById('empty-state');
  const canvasHost = document.getElementById('canvas-host');
  const topbar = document.getElementById('topbar');
  const sceneLabel = document.getElementById('scene-label');
  const hintEl = document.getElementById('hint');
  const loadingEl = document.getElementById('loading');
  const fadeEl = document.getElementById('fade');
  const toastEl = document.getElementById('toast');
  const projectNameEl = document.getElementById('project-name');
  const projectDescEl = document.getElementById('project-desc');

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  /* ---------------- Load tour ---------------- */
  async function loadAll(){
    const res = await api('/api/state');
    if (!res.ok){
      showConnBanner('Can\u2019t reach the tour server right now. Please try again shortly.');
      return;
    }
    meta = { name: res.data.name, description: res.data.description || '', order: res.data.order || [] };
    scenes = res.data.scenes || {};
    projectNameEl.textContent = meta.name;
    projectDescEl.textContent = meta.description;
    projectDescEl.classList.toggle('hidden', !meta.description);
    document.title = meta.name;

    renderSidebar();
    if (meta.order.length){
      currentId = meta.order[0];
      await enterScene(currentId, false);
    }
  }

  /* ---------------- Sidebar (read-only) ---------------- */
  function renderSidebar(){
    sceneListEl.innerHTML = '';
    meta.order.forEach(id => {
      const s = scenes[id];
      if (!s) return;
      const row = document.createElement('div');
      row.className = 'scene-row' + (id === currentId ? ' active' : '');
      const dot = document.createElement('div');
      dot.className = 'scene-dot';
      const name = document.createElement('div');
      name.className = 'scene-name';
      name.textContent = s.name;
      row.appendChild(dot);
      row.appendChild(name);
      row.addEventListener('click', () => { if (id !== currentId) switchScene(id); });
      sceneListEl.appendChild(row);
    });
  }

  function showEmpty(){
    emptyStateEl.classList.remove('hidden');
    canvasHost.classList.add('hidden');
    topbar.classList.add('hidden');
    hintEl.classList.add('hidden');
  }
  function showViewer(){
    emptyStateEl.classList.add('hidden');
    canvasHost.classList.remove('hidden');
    topbar.classList.remove('hidden');
    hintEl.classList.remove('hidden');
  }

  /* ---------------- Three.js viewer ---------------- */
  let renderer, camera, scene3d, sphereMesh, raycaster, mouse;
  let lon = 0, lat = 0, targetLon = 0, targetLat = 0;
  let isPointerDown = false, downX = 0, downY = 0, moved = false;
  let hotspotSprites = [];
  let currentTexture = null;

  function initThree(){
    if (renderer) return;
    const width = canvasHost.clientWidth, height = canvasHost.clientHeight;
    camera = new THREE.PerspectiveCamera(75, width / height, 1, 1200);
    scene3d = new THREE.Scene();

    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0x1b1f26 });
    sphereMesh = new THREE.Mesh(geometry, material);
    scene3d.add(sphereMesh);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(width, height);
    canvasHost.appendChild(renderer.domElement);

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    dom.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('resize', onResize);

    animate();
  }

  function onResize(){
    if (!renderer) return;
    const width = canvasHost.clientWidth, height = canvasHost.clientHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  }

  function onPointerDown(e){
    isPointerDown = true; moved = false;
    downX = e.clientX; downY = e.clientY;
    canvasHost.classList.add('dragging');
  }
  function onPointerMove(e){
    if (!isPointerDown) return;
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    targetLon -= dx * 0.13;
    targetLat += dy * 0.13;
    targetLat = Math.max(-85, Math.min(85, targetLat));
    downX = e.clientX; downY = e.clientY;
  }
  function onPointerUp(e){
    if (isPointerDown && !moved) handleClick(e.clientX, e.clientY);
    isPointerDown = false;
    canvasHost.classList.remove('dragging');
  }
  function onWheel(e){
    e.preventDefault();
    camera.fov = Math.max(32, Math.min(95, camera.fov + e.deltaY * 0.04));
    camera.updateProjectionMatrix();
  }

  function handleClick(clientX, clientY){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(hotspotSprites.map(h => h.mesh));
    if (hits.length){
      const hit = hotspotSprites.find(h => h.mesh === hits[0].object);
      if (hit) switchScene(hit.hotspot.target);
    }
  }

  function makeHotspotSprite(){
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 10, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(233,231,224,0.85)';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 30, 0, Math.PI*2);
    ctx.fillStyle = '#c08a4e';
    ctx.fill();
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(34, 34, 1);
    return sprite;
  }

  function buildHotspots(){
    hotspotSprites.forEach(h => scene3d.remove(h.mesh));
    hotspotSprites = [];
    const s = scenes[currentId];
    if (!s) return;
    (s.hotspots || []).forEach(hotspot => {
      const sprite = makeHotspotSprite();
      const dir = new THREE.Vector3(hotspot.x, hotspot.y, hotspot.z).normalize();
      sprite.position.copy(dir.multiplyScalar(480));
      scene3d.add(sprite);
      hotspotSprites.push({ mesh: sprite, hotspot });
    });
  }

  function animate(){
    requestAnimationFrame(animate);
    lon += (targetLon - lon) * 0.12;
    lat += (targetLat - lat) * 0.12;
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    const x = 500 * Math.sin(phi) * Math.cos(theta);
    const y = 500 * Math.cos(phi);
    const z = 500 * Math.sin(phi) * Math.sin(theta);
    camera.lookAt(x, y, z);
    if (renderer) renderer.render(scene3d, camera);
  }

  function loadTextureForCurrent(){
    return new Promise((resolve) => {
      const loader = new THREE.TextureLoader();
      loader.load(
        '/api/images/' + currentId,
        (texture) => {
          if (currentTexture) currentTexture.dispose();
          currentTexture = texture;
          sphereMesh.material.map = texture;
          sphereMesh.material.color.set(0xffffff);
          sphereMesh.material.needsUpdate = true;
          resolve();
        },
        undefined,
        () => { toast('Could not load this photo.'); resolve(); }
      );
    });
  }

  /* ---------------- Scene transitions ---------------- */
  async function enterScene(id, doFade){
    currentId = id;
    showViewer();
    initThree();
    if (doFade) fadeEl.classList.add('on');
    loadingEl.classList.remove('hidden');
    await loadTextureForCurrent();
    buildHotspots();
    lon = targetLon; lat = targetLat = 0; targetLon = lon;
    sceneLabel.textContent = scenes[id].name;
    updateHint();
    loadingEl.classList.add('hidden');
    if (doFade) setTimeout(() => fadeEl.classList.remove('on'), 30);
    renderSidebar();
  }

  async function switchScene(id){
    if (!scenes[id]) return;
    fadeEl.classList.add('on');
    await new Promise(r => setTimeout(r, 180));
    await enterScene(id, true);
  }

  function updateHint(){
    const s = scenes[currentId];
    const hasHotspots = s && s.hotspots && s.hotspots.length;
    hintEl.textContent = hasHotspots
      ? 'Drag to look around · click a marker to move to that room'
      : 'Drag to look around · scroll to zoom';
  }

  /* ---------------- Boot ---------------- */
  loadAll();

})();
</script>
</body>
</html>
